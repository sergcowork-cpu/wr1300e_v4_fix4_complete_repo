name: WR1300E V2 OpenWrt 25.12.6 V4 LEDs (FIX4 ABI checked)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Free space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache /usr/local/lib/android /opt/ghc || true
          df -h .
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools rsync unzip zlib1g-dev file wget xz-utils swig time curl ca-certificates device-tree-compiler zstd cpio patch bzip2 perl subversion
      - name: Build and validate firmware
        shell: bash
        run: bash ./build_linux.sh
      - name: Upload verified firmware
        uses: actions/upload-artifact@v6
        with:
          name: WR1300E_V2_25.12.6_V4_FIX4_OFFICIAL_ABI_UNTESTED
          if-no-files-found: error
          retention-days: 14
          path: |
            openwrt/bin/targets/ramips/mt7621/*cudy_wr1300e-v2*squashfs-sysupgrade.bin
            openwrt/bin/targets/ramips/mt7621/*cudy_wr1300e-v2*.manifest
            openwrt/bin/targets/ramips/mt7621/sha256sums
            openwrt/bin/targets/ramips/mt7621/profiles.json
            diagnostics/led-abi-validation.json
            diagnostics/ABI_RESULT.txt
            diagnostics/kmod-diff.txt
      - name: Preserve unvalidated candidate if validation fails (DO NOT FLASH)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: WR1300E_V4_FIX4_CANDIDATE_DO_NOT_FLASH
          if-no-files-found: ignore
          retention-days: 14
          path: |
            openwrt/bin/targets/ramips/mt7621/*cudy_wr1300e-v2*squashfs-sysupgrade.bin
            openwrt/bin/targets/ramips/mt7621/*cudy_wr1300e-v2*.manifest
            openwrt/bin/targets/ramips/mt7621/profiles.json
            openwrt/bin/targets/ramips/mt7621/sha256sums
            diagnostics/ABI_RESULT.txt
            diagnostics/final-validation.txt
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: WR1300E_V4_FIX4_DIAGNOSTICS
          if-no-files-found: ignore
          retention-days: 14
          path: diagnostics/
